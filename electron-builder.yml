appId: com.navalqda.desktop
productName: NAVAL-QDA
directories:
  buildResources: build
files:
  - from: frontend/dist
    to: .
    filter:
      - '**/*'
  - from: electron
    to: electron
    filter:
      - '**/*'
  - package.json
  - package-lock.json
extraResources:
  - from: build/ffmpeg
    to: ffmpeg
  - from: build/whisper
    to: whisper
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.education
  icon: build/icon.png
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Education
  icon: build/icon.png
