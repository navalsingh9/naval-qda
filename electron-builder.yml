appId: com.navalqda.desktop
productName: NAVAL-QDA
directories:
  buildResources: build
files:
  - from: frontend/dist
    to: .
    filter:
      - '**/*'
  - from: electron
    to: electron
    filter:
      - '**/*'
  - from: backend
    to: backend
    filter:
      - '**/*'
      - '!**/*.test.js'
  - package.json
  - package-lock.json
  - node_modules/**/*
# better-sqlite3 ships a native .node binary — Node cannot dlopen a native
# addon from inside an asar archive, so it must be unpacked alongside it.
asarUnpack:
  - node_modules/better-sqlite3/**/*
extraResources:
  - from: build/ffmpeg
    to: ffmpeg
  - from: build/whisper
    to: whisper
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png
nsis:
  # electron-builder's default NSIS uninstaller leaves the app's userData
  # folder (and with it navalqda.db) behind after uninstall, which is what
  # made projects/sources appear to survive an uninstall+reinstall. This
  # makes "uninstall" actually mean uninstall.
  deleteAppDataOnUninstall: true
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.education
  icon: build/icon.png
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Education
  icon: build/icon.png
