version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Root package.json — Electron shell and main-process dependencies.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      electron:
        patterns:
          - "electron"
          - "electron-builder"

  # The renderer has its own lockfile, so it needs its own entry — this is
  # the one that was silently unwatched.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
