# OpenSSF Scorecard.
#
# Grades the repository's supply-chain posture -- branch protection, pinned
# dependencies, token permissions, whether releases are signed, whether
# security scanning runs at all -- and writes the result to the Security tab.
#
# Worth having on a research tool specifically: someone deciding whether to
# trust NAVAL-QDA with their interview data has no way to audit it themselves,
# and this is a published, third-party answer to "is this maintained with any
# discipline". It also catches drift, such as an action quietly reverting to
# a floating tag.
#
# This workflow uses actions not certified by GitHub, provided by third
# parties under their own terms.

name: Scorecard supply-chain security

on:
  # Re-grade when branch protection changes -- that check only reads the
  # default branch.
  branch_protection_rule:
  schedule:
    - cron: '27 9 * * 4'
  push:
    branches: [ "main" ]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    # publish_results only works from the default branch.
    if: github.event.repository.default_branch == github.ref_name || github.event_name == 'pull_request'
    permissions:
      # Needed to upload results to the code-scanning dashboard.
      security-events: write
      # Needed to publish results and get the badge.
      id-token: write

    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishes to the OpenSSF REST API so the score is publicly
          # readable and the README badge works. Public repo, so this is
          # only exposing what is already visible.
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: results.sarif
