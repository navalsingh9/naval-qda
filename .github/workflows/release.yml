name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Least-privilege default: most jobs here only read the repo and upload a
# build artifact, so they get read-only access unless a job explicitly
# needs more (the release job below overrides this with contents: write).
permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: win
            script: npm run release:win
          - os: macos-latest
            artifact: mac
            script: npm run release:mac
          - os: ubuntu-latest
            artifact: linux
            script: npm run release:linux

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: ${{ matrix.script }}

      - uses: actions/upload-artifact@v4
        with:
          name: naval-qda-${{ matrix.artifact }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**
